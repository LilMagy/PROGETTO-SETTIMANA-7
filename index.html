<!doctype html>
<html lang="it" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Squadre Sportive</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <nav class="navbar border-bottom">
    <div class="container">
      <span class="navbar-brand fw-bold">🏟️ Squadre Sportive</span>
      <button id="theme-toggle" class="btn btn-outline-secondary btn-sm" type="button" aria-label="Cambia tema">🌓</button>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h3 mb-3">Cerca una squadra</h1>

    <form id="search-form" class="row g-2 mb-3" role="search">
      <div class="col-12 col-md">
        <input id="search-input" class="form-control form-control-lg" type="search"
               placeholder="Es. Arsenal, Lakers, Juventus…" autocomplete="off" aria-label="Nome squadra">
      </div>
      <div class="col-8 col-md-auto">
        <select id="sport-filter" class="form-select form-select-lg" aria-label="Filtra per sport" disabled>
          <option value="">Tutti gli sport</option>
        </select>
      </div>
      <div class="col-4 col-md-auto">
        <button class="btn btn-primary btn-lg w-100" type="submit">Cerca</button>
      </div>
    </form>

    <div id="alert-area"></div>

    <div id="spinner" class="text-center my-4 d-none">
      <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Caricamento…</span></div>
    </div>

    <section id="favorites-section" class="mb-4 d-none">
      <h2 class="h5">★ Preferiti</h2>
      <div id="favorites-list" class="row g-3 row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4"></div>
    </section>

    <section id="events-section" class="mb-4 d-none">
      <h2 id="events-title" class="h5"></h2>
      <div id="events-alert"></div>
      <div id="events-spinner" class="text-center my-3 d-none">
        <div class="spinner-border spinner-border-sm text-primary" role="status"><span class="visually-hidden">Caricamento…</span></div>
      </div>
      <div class="row g-3">
        <div class="col-12 col-lg-6">
          <h3 class="h6 text-uppercase text-body-secondary">Ultimi eventi</h3>
          <div id="events-last" class="list-group"></div>
        </div>
        <div class="col-12 col-lg-6">
          <h3 class="h6 text-uppercase text-body-secondary">Prossimi eventi</h3>
          <div id="events-next" class="list-group"></div>
        </div>
      </div>
      <p class="small text-body-secondary mt-2 mb-0">Con la chiave gratuita l'API mostra solo le partite giocate in casa.</p>
    </section>

    <section>
      <h2 id="results-title" class="h5 d-none">Risultati</h2>
      <div id="results-list" class="row g-3 row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4"></div>
    </section>
  </main>

  <div class="modal fade" id="event-modal" tabindex="-1" aria-labelledby="event-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="event-modal-title"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Chiudi"></button>
        </div>
        <div class="modal-body" id="event-modal-body"></div>
      </div>
    </div>
  </div>

  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
