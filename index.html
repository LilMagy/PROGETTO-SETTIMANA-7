<!doctype html>
<!--
  STRUTTURA DELLA PAGINA
  Questo file contiene solo lo "scheletro": gli elementi vuoti o nascosti che
  script.js riempie e mostra. Ogni elemento con un id viene letto da script.js
  (vedi SEZIONE 1 dello script).

  Ordine dall'alto in basso:
    1. form di ricerca          -> l'utente scrive e preme "Cerca"
    2. alert-area               -> messaggi (errori, avvisi) della ricerca
    3. spinner                  -> rotellina durante la ricerca
    4. events-section           -> ultimo/prossimo evento (nascosta finché non si clicca una card)
    5. results-list             -> le card delle squadre trovate

  La classe Bootstrap "d-none" nasconde un elemento: lo script la toglie/aggiunge
  per mostrare o nascondere spinner e sezione eventi.
-->
<html lang="it">
<head>
  <meta charset="utf-8">
  <!--Layout responsive su telefono e tablet -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Squadre Sportive</title>
  <!-- Bootstrap 5: fornisce griglia, card, form, spinner e alert già stilizzati -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
</head>
<body>
  <main class="container py-4">
    <h1 class="h3 mb-3">Cerca una squadra</h1>

    <!-- 1. FORM DI RICERCA
         Il pulsante di tipo "submit" (o il tasto Invio) genera l'evento "submit",
         ascoltato da script.js (SEZIONE 4).
         col-8 / col-4 su mobile: input e pulsante stanno sulla stessa riga. -->
    <form id="search-form" class="row g-2 mb-3">
      <div class="col-8 col-md">
        <input id="search-input" class="form-control form-control-lg" type="search"
               placeholder="Es. Arsenal, Lakers, Juventus…" autocomplete="off">
      </div>
      <div class="col-4 col-md-auto">
        <button class="btn btn-primary btn-lg w-100" type="submit">Cerca</button>
      </div>
    </form>

    <!-- 2. ALERT: vuoto all'inizio; showAlert() ci scrive dentro un messaggio -->
    <div id="alert-area"></div>

    <!-- 3. SPINNER della ricerca: nascosto (d-none) finché una ricerca è in corso -->
    <div id="spinner" class="text-center my-4 d-none">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Caricamento…</span>
      </div>
    </div>

    <!-- 4. SEZIONE EVENTI: nascosta; loadEvents() la mostra dopo il click su una card -->
    <section id="events-section" class="mb-4 d-none">
      <h2 id="events-title" class="h5"></h2> <!-- "Eventi di <squadra>" -->
      <div id="events-spinner" class="text-center my-3 d-none">
        <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
      </div>
      <div id="events-alert"></div> <!-- errori nel caricamento degli eventi -->
      <div class="row g-3" id="events-row">
        <!-- Colonna sinistra: ultimo evento (riempita con formatEvent) -->
        <div class="col-12 col-md-6">
          <div class="card h-100"><div class="card-body">
            <h3 class="h6 text-uppercase text-body-secondary">Ultimo evento</h3>
            <div id="event-last"></div>
          </div></div>
        </div>
        <!-- Colonna destra: prossimo evento (riempita con formatEvent) -->
        <div class="col-12 col-md-6">
          <div class="card h-100"><div class="card-body">
            <h3 class="h6 text-uppercase text-body-secondary">Prossimo evento</h3>
            <div id="event-next"></div>
          </div></div>
        </div>
      </div>
    </section>

    <!-- 5. LISTA SQUADRE: vuota all'avvio; renderTeams() aggiunge una colonna per squadra.
         Colonne per riga: 1 (mobile) / 2 (>=768px, tablet) / 3 (>=992px) / 4 (>=1200px). -->
    <div id="results-list" class="row g-3 row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4"></div>
  </main>

  <!-- Lo script è in fondo al body: quando parte, tutti gli elementi sopra esistono già -->
  <script src="script.js"></script>
</body>
</html>
